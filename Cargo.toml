[workspace]
resolver = "2"
members = [
    "crates/virus-core",
    "crates/virus-eval",
    "crates/virus-search",
    "crates/virus-mcts",
    "crates/virus-proto",
    "crates/virus-arena",
    "crates/virus-selfplay",
    "crates/vsbot",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/korjavin/vsbot"

[workspace.dependencies]
virus-core = { path = "crates/virus-core" }
virus-eval = { path = "crates/virus-eval" }
virus-search = { path = "crates/virus-search" }
virus-mcts = { path = "crates/virus-mcts" }
virus-proto = { path = "crates/virus-proto" }
virus-arena = { path = "crates/virus-arena" }
virus-selfplay = { path = "crates/virus-selfplay" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
# `rustls-tls-webpki-roots` keeps wss:// working (vs.wandergeek.org) without a
# system OpenSSL, which the deploy image would otherwise have to carry.
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-webpki-roots",
] }
# tokio-tungstenite 0.30 pulls rustls but deliberately picks **no** crypto
# provider, so a `wss://` dial panics at handshake time unless the application
# selects one. `default-features = false` matters: rustls' defaults would turn
# on `aws-lc-rs` *as well as* our `ring`, and two providers are as fatal as
# zero. Only the `vsbot` bin depends on this — see its `main`.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# `cargo test` is the parity gate, and the search fixtures replay 570 complete
# alpha-beta searches. Unoptimized that single test file runs for over 25
# minutes — longer than CI's entire budget — against well under a minute here.
# `debug-assertions` and `overflow-checks` stay on (that is what the tests are
# for); only the codegen quality changes. `profile.test` inherits from this.
[profile.dev]
opt-level = 2
