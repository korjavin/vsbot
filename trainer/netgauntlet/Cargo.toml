# `netgauntlet` — candidate-vs-champion (net-vs-net) gauntlet for the RL loop.
#
# ## Why this is a separate package and not a `virus-arena` flag
#
# `arena` refuses `--a mcts:X --b mcts:Y` with two *different* artifacts, on
# purpose: `virus_arena::gauntlet::run` shares one loaded `PolicyValueNet`
# across every game and thread, so honouring two paths needs a second net
# threaded through `engine::build`'s call sites — real work in a crate whose
# job is to be a trustworthy instrument. `docs/CANARY.md` records that gap
# under "Harness status" and points Gate A at the Java nightly meanwhile.
#
# A generation's gate needs exactly that comparison, and the RL executor's file
# territory is `trainer/**`. So this package does the one thing arena cannot,
# by *reusing* arena rather than reimplementing it: the pairing RNG
# (`virus_arena::rng`), the side construction (`virus_arena::engine::build` —
# same `MctsSide`, same `ValueSource::Net`, same `Config::play()`), and the
# pooled/Wilson arithmetic (`virus_arena::stats`) are all arena's. Only the
# game loop is local, and only because it holds two nets instead of one.
#
# The proper end state is `--a-net`/`--b-net` inside `virus-arena`, at which
# point this package deletes and `generation.sh` calls `arena`. It is a
# follow-up bead, not this one's work.
#
# ## Why `[workspace]` below
#
# This directory sits inside the vsbot workspace's tree but is not one of its
# members, which cargo would otherwise reject ("believes it's in a workspace
# when it's not"). The empty table makes it its own workspace root, which is
# also what keeps it out of `cargo build --workspace`, `cargo clippy
# --workspace -- -D warnings` and CI: it is a local measuring tool for the RL
# loop, not shipped code, and it must not widen the gates the shipped crates
# are held to. `crates/**` stays untouched.
[workspace]

[package]
name = "netgauntlet"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[dependencies]
virus-core = { path = "../../crates/virus-core" }
virus-mcts = { path = "../../crates/virus-mcts" }
virus-arena = { path = "../../crates/virus-arena" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
