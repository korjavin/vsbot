[package]
name = "vsbot"
description = "The bot binary: reads env config in one place and wires the engine crates together."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "vsbot"
path = "src/main.rs"

[dependencies]
virus-core = { workspace = true }
virus-eval = { workspace = true }
virus-search = { workspace = true }
virus-mcts = { workspace = true }
virus-proto = { workspace = true }
virus-arena = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
# Not used for its API — only to select rustls' crypto provider for the whole
# build (see `main`). Without it a `wss://` connection panics on first dial.
rustls = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "process", "sync"] }
# `SearchBudget` is built from a `CancellationToken`, so any test that drives an
# engine directly needs one.
tokio-util = { workspace = true }
# The multiplayer live game needs a lobby *host*, and hosting is not something a
# bot does: `create_lobby`, `add_bot` and `start_multiplayer_game` have no place
# in `virus-proto`, which exists to play games it is invited to. The test drives
# a raw socket for those three frames instead, so the protocol crate stays the
# shape the deployment needs it to be.
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
uuid = { workspace = true }
