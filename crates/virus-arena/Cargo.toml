[package]
name = "virus-arena"
description = "Gauntlet harness: colour-paired seeds, SplitMix64 derivation, Wilson95 intervals."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
virus-core = { workspace = true }
virus-eval = { workspace = true }
virus-search = { workspace = true }
virus-mcts = { workspace = true }
# `probes` reads and writes the probe set as JSONL and carries the wire
# `Snapshot` verbatim, so the fixture is re-validated by the same decoder the
# live client uses (ARCHITECTURE.md invariant 5).
serde = { workspace = true }
serde_json = { workspace = true }

# `src/bin/arena.rs` is the CLI a human runs a gauntlet with. It lives in this
# crate rather than as a subcommand of `vsbot`: `vsbot` is the deployed
# container's entrypoint and must not grow a code path that loads gauntlet
# machinery into the production image.
#
# Deliberately left to cargo's `src/bin/*.rs` auto-discovery instead of an
# explicit `[[bin]]` with a `path`. The Dockerfile's dependency-cache layer
# builds `-p vsbot` against stub crates that have only an empty `src/lib.rs`,
# so an explicitly-pathed target would name a file that does not exist in that
# layer. Today cargo tolerates that; auto-discovery simply finds nothing, which
# needs no tolerance.
